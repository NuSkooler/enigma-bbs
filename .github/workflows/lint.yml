name: Lint

on:
  push:
    branches: [ master ]

  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          #  package.json requires >=22
          node-version: '22'
          cache: npm

      - name: Install
        #  ci rather than install so the lockfile is honoured, and
        #  --include=dev because eslint is a devDependency
        run: npm ci --include=dev

      - name: ESLint
        run: npm run lint

      - name: Prettier
        #  --check is the read-only half of `npm run pretty`; it reports the
        #  files that differ and exits non-zero rather than rewriting them.
        run: npm run pretty:check
