name: Docker

on:
  push:
    branches: [ master ]

  pull_request:
    #  The inputs that decide whether the image builds. Application source is
    #  copied in after npm ci and cannot fail it, so it is left out rather
    #  than spending eleven minutes under QEMU on every pull request.
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'

  workflow_dispatch:

concurrency:
  #  Master collapses onto one group: there is a single mutable tag, so a run
  #  that has been superseded can only publish a :latest older than the one
  #  that superseded it. Pull requests get a lane each, so they cancel neither
  #  a publish nor one another.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        #  A pull request from a fork is given no secrets, so this would fail
        #  -- and it has nothing to log in for, since it does not publish.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          tags: enigmabbs/enigma-bbs:latest
          file: docker/Dockerfile
          #  linux/arm/v8 is not a platform the base image publishes -- arm64
          #  is already ARMv8 -- and asking for it now fails the build rather
          #  than silently resolving to amd64 as it used to.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          #  A pull request builds every platform and publishes nothing. The
          #  arm legs are where an image change usually breaks -- a lockfile
          #  that resolves differently under QEMU, a native module that will
          #  not compile -- so building only amd64 would check the half that
          #  rarely fails.
          push: ${{ github.event_name != 'pull_request' }}
          #  The arm legs rebuild node-pty, better-sqlite3 and cpu-features
          #  under QEMU every run. A pull request reads master's cache but
          #  writes none of its own: master cannot read a branch cache back,
          #  so the write would only evict from the shared 10 GB that every
          #  pull request's `cache: npm` comes out of.
          #
          #  mode=max, not min. min exports only the layers of the final
          #  image, and since #814 the npm ci layer -- the one the QEMU
          #  rebuilds live in -- belongs to the discarded build stage. With
          #  min it would be recompiled on every master push and the cache
          #  would hold only the cheap half.
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

